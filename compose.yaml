# Development stack.
#
#   cp .env.example .env                 once, then fill it in
#   docker compose up --build            everything
#   docker compose up -d postgres redis  infra only, bot on the host

name: circuit-bot

services:
  bot:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      # Where the services are.  Everything else arrives through env_file:.
      POSTGRES_HOST: postgres
      REDIS_HOST: redis

      # Pinned: in .env these are the ports a *host* run dials - the published
      # port, which is not the port the service listens on.
      POSTGRES_PORT: "5432"
      REDIS_PORT: "6379"

      STAGE: ${STAGE:-dev}
    volumes:
      # The dev image installs the project editable at /app/src.
      - ./src:/app/src
      # League settings; the bot reads ./config.toml from its working directory.
      - ./config.toml:/app/config.toml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: no

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # :? rather than a fallback - a default credential is one nobody rotates.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-circuit}
    volumes:
      # Postgres 18 declares its volume here, not at the old .../data path.
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # -h forces TCP; initdb's temporary server is socket-only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # requirepass has to be an argument - the image reads no password from the env.
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    environment:
      # So the healthcheck authenticates without repeating the password.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
